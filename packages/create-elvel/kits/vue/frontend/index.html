<!doctype html>
<!--
  Not the document this application serves.

  The server renders that one, with the first screen's data embedded in it — so
  opening Vite's own port shows a page with nothing to boot from. This file is here
  for the build: `transformIndexHtml` is how a Vite plugin adds tags to a page, and
  that hook needs an HTML input. `@elvel/vite` builds this one, takes what the
  plugins injected, and drops the page before it can be published.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }}</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
