name: docs

# The documentation site, built and deployed to GitHub Pages.
#
# Only on `main`, and only when something it renders actually changed: a Pages
# deployment replaces what is live, and re-publishing an unchanged site to say
# "a test was renamed" spends minutes and tells nobody anything.
#
# The site lives at https://ufhy.github.io/elvel/, so `base: '/elvel/'` in the
# VitePress config is load-bearing — without it every asset resolves one level
# too high and the page loads unstyled.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  # One deployment at a time, and let a newer one win: unlike a release, being
  # interrupted here leaves nothing half-published.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: bun install --frozen-lockfile

      # `ignoreDeadLinks` is off in the config, so a link to a page that no longer
      # exists fails here rather than becoming a 404 somebody else finds.
      - run: bun run --cwd apps/docs build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # What Pages needs, and nothing else: `pages` to publish, `id-token` for the
      # deployment's own attestation. `contents` stays read-only.
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
