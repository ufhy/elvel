name: verify

# Three platforms, because the bugs that got through were all platform-shaped.
#
# A Windows path lost its separators inside generated source; `for await` over a
# ReadableStream compiled on macOS and Windows and failed to typecheck on Linux —
# and a scaffolded application inherited that error. Each was found by somebody
# happening to change machines. This is what should have found them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by `release.yml`, so a release runs exactly the checks a push runs
  # rather than a second, thinner copy of them.
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}-${{ github.workflow }}
  # A release must not be cancelled by the push that carries its tag.
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

defaults:
  run:
    # Available on all three runners, so one script works everywhere.
    shell: bash

env:
  # Pinned rather than "latest": a runtime that changes under us turns a red
  # build into a mystery. Bump it deliberately.
  BUN_VERSION: 1.4.0

# Every action is pinned to a commit, with the version beside it. A tag is a
# label somebody else can move: `@v4` today and `@v4` tomorrow need not be the
# same code, and one of these runs with `id-token: write` in `release.yml`,
# which is npm publishing rights. Dependabot bumps the SHAs and keeps the
# comments honest.
jobs:
  # ---------------------------------------------------------------- audit
  #
  # Dependabot cannot do this for us. It supports Bun for version updates only —
  # security updates are unsupported for `bun.lock` — so nothing would ever open
  # a pull request to say a dependency became vulnerable. `bun audit` asks the
  # registry directly.
  #
  # Its own job rather than a step inside `linux`: it needs no services and no
  # matrix, it finishes in seconds, and when it is what went red that should be
  # legible at a glance.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Printed in full first, so the log says what is known even when none of it
      # is bad enough to stop anything.
      - name: What the registry knows about our dependencies
        run: bun audit || true

      # High and critical fail the run; low and moderate do not. `release.yml`
      # waits on this job, so a stricter gate would let a low advisory in some
      # dev dependency block a release — and a release is often how a fix ships.
      - name: Nothing high or critical
        run: bun audit --audit-level=high

  # ---------------------------------------------------------------- linux
  #
  # The full run: every dialect, both caches, the queue drivers, and the smoke
  # suite. Service containers only exist on Linux runners, so this is the only
  # job that can exercise Postgres, MySQL and Redis.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          # The suite connects as `postgres` with no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        # 3309 outside, because that is what the suite looks for.
        ports: ['3309:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # A dialect whose server is unreachable is *skipped* with a note, which is
      # right on a laptop and wrong here: a container that failed to start would
      # let this job go green without testing Postgres, MySQL or Redis at all.
      - name: Every server this job promises is actually up
        run: |
          fail=0
          for hostport in 127.0.0.1:5432 127.0.0.1:3309 127.0.0.1:6379; do
            if timeout 5 bash -c "echo > /dev/tcp/${hostport%:*}/${hostport#*:}" 2>/dev/null; then
              echo "  $hostport up"
            else
              echo "  $hostport DOWN — the suite would silently skip it"
              fail=1
            fi
          done
          exit $fail

      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run smoke

  # ------------------------------------------------------- macos & windows
  #
  # No service containers, so the dialect and driver suites skip their servers
  # and say so. What is left is still worth running on both: lint, the types, and
  # every test that does not need a server — which is where the platform-shaped
  # bugs actually lived.
  #
  # No database here because service containers only run on Linux runners, not
  # because Bun cannot reach one: MySQL on Windows hung until Bun 1.4 and now
  # runs 151 dialect tests in 9 seconds, measured. See BEHAVIOURS.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
